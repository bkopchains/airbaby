# GitHub Pages deploy via Actions is paused while `airbaby-ui` is a local
# `file:../airbaby-ui` dependency (CI has no sibling checkout).
#
# For now, ship from your machine (same idea as wedbug's cf:deploy):
#   npm run deploy
#
# When airbaby-ui is on npm:
#   1. npm run kit:use-npm
#   2. Re-enable the `push` trigger below (uncomment it)
#   3. In repo Settings → Pages, set source back to GitHub Actions if you
#      switched to the gh-pages branch for local deploys

name: Deploy Vite site to Pages

on:
  # push:
  #   branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
